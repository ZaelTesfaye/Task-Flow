worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_disable "msie6";

    upstream nodejs_cluster {
        server app:5000;
    }

    server {
        listen 443 ssl;
        server_name task-flows.tech www.task-flows.tech default_server;

        # ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
        # ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;
        ssl_certificate /etc/nginx/certs/task-flows.tech/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/task-flows.tech/privkey.pem;

        location /api {
            proxy_pass http://nodejs_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location / {
            root /var/www/task-flow-client;
            add_header Cache-Control "public, max-age=60" always;
            index index.html;
            try_files $uri $uri/ /404.html;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /var/www/task-flow-client;
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
        }
    }

    server {
        listen 443 ssl;
        server_name admin.task-flows.tech;

        # ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
        # ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;
        ssl_certificate /etc/nginx/certs/task-flows.tech/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/task-flows.tech/privkey.pem;

        location / {
            root /var/www/task-flow-admin/;
            add_header Cache-Control "public, max-age=60" always;
            index index.html;
            try_files $uri $uri/ /index.html;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /var/www/task-flow-admin/;
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
        }
    }

    server {
        listen 443 ssl;
        server_name admin.studio.taskflows.tech;

        ssl_certificate /etc/nginx/certs/task-flows.tech/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/task-flows.tech/privkey.pem;

        location / {
            proxy_pass http://nodejs_cluster/api/admin/studio/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    server {
        listen 443 ssl;
        server_name monitor.task-flows.tech;

        ssl_certificate /etc/nginx/certs/task-flows.tech/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/task-flows.tech/privkey.pem;

        location / {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    server {
        listen 80;
        server_name _;
        location / {
            return 301 https://$host$request_uri;
        }
    }
}