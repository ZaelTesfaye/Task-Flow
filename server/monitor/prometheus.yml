global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels: # Labels added to every metric Prometheus collects for multiple prom instances
    environment: production
    region: local

scrape_configs:
  - job_name: "app"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["process1:5000", "process2:5000"]
        labels:
          service: app
    metrics_path: "/api/metrics"

  - job_name: "prometheus"
    scrape_interval: 30s # self-scrape less frequently, it's low priority
    scrape_timeout: 10s
    static_configs:
      - targets: ["localhost:9090"]

# Storage retention — be explicit, don't rely on defaults
storage:
  tsdb:
    retention.time: 30d # keep 30 days of metrics
    retention.size: 10GB # OR delete oldest data if disk exceeds 10GB
