positions: # How far Promtail has read each log source. without, every restart re-reads all logs from scratch
  filename: /var/log/promtail/positions.yaml

server:
  http_listen_port: 9080
  log_level: warn

clients:
  - url: http://loki:3100/loki/api/v1/push
    timeout: 10s # How long to wait for Loki to accept a batch.

    backoff_config: # Loki returning errors, Promtail will retry with increasing delays
      min_period: 500ms # Wait 500ms before first retry
      max_period: 5m
      max_retries: 10

    queue_capacity: 1000 # How many log batches to hold in memory while waiting to send to Loki, prevents Promtail from dropping logs immediately.

scrape_configs:
  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/nginx"
        action: drop
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
      - labels:
          level:
      - limit: # Rate limiter — how many lines per second Promtail forwards to Loki per stream.
          rate: 1000 # Max 1000 log lines per second
          burst: 2000 # Allow short bursts up to 2000 lines

  - job_name: nginx_logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/nginx"
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
    pipeline_stages:
      - json:
          expressions:
            status: status
            method: method
            uri: uri
            ip: ip
      - labels:
          status:
          method:
      # Drop health check and metrics endpoints — these are called constantly
      # by load balancers and monitoring tools and add zero value to your logs.
      # Without this, they account for ~40% of nginx log volume in production.
      - drop:
          expression: '(uri =~ ".*/health.*" or uri =~ ".*/ping.*" or uri =~ ".*/metrics.*")'
      - limit:
          rate: 1000
          burst: 2000
