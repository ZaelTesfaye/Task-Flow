services:
  process1:
    image: ${DOCKER_USERNAME}/${IMAGE_NAME}:latest
    env_file:
      - ./.env
    environment:
      CONTAINER_NAME: process1
      DATABASE_URL: postgresql://task-manager-db:${DB_PASSWORD}@db:5432/tasks
      REDIS_URL: redis://redis:6379
    restart: on-failure
    depends_on:
      migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
      seeder:
        condition: service_completed_successfully
      
    volumes:
      - logs_data:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:5000/api/health"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 10s

  process2:
    image: ${DOCKER_USERNAME}/${IMAGE_NAME}:latest
    env_file:
      - ./.env
    environment:
      CONTAINER_NAME: process2
      DATABASE_URL: postgresql://task-manager-db:${DB_PASSWORD}@db:5432/tasks
      REDIS_URL: redis://redis:6379
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrator:
        condition: service_completed_successfully
      seeder:
        condition: service_completed_successfully
    volumes:
      - logs_data:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:5000/api/health"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 10s

  db:
    image: postgres:15.14
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: task-manager-db
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task-manager-db -d tasks"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 10s

  migrator:
    image: ${DOCKER_USERNAME}/${IMAGE_NAME}:latest
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://task-manager-db:${DB_PASSWORD}@db:5432/tasks
    command: npx prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./prisma:/app/prisma:ro
  
  seeder:
    image: ${DOCKER_USERNAME}/${IMAGE_NAME}:latest
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://task-manager-db:${DB_PASSWORD}@db:5432/tasks
    command: npm run seed
    depends_on:
      migrator:
        condition: service_completed_successfully

  redis:
    image: redis:alpine3.22
    container_name: redis
    command: redis-server --loglevel warning
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:stable-alpine3.21
    environment:
    - NGINX_ENTRYPOINT_QUIET_LOGS=1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/deployment/task-flow/client:/var/www/task-flow-client:ro
      - /home/deployment/task-flow/admin:/var/www/task-flow-admin:ro
      - /etc/letsencrypt/live/api.desonames.xyz/fullchain.pem:/etc/nginx/certs/api.desonames.xyz/fullchain.pem:ro
      - /etc/letsencrypt/live/api.desonames.xyz/privkey.pem:/etc/nginx/certs/api.desonames.xyz/privkey.pem:ro
      - /etc/letsencrypt/live/task-flows.tech/fullchain.pem:/etc/nginx/certs/task-flows.tech/fullchain.pem:ro
      - /etc/letsencrypt/live/task-flows.tech/privkey.pem:/etc/nginx/certs/task-flows.tech/privkey.pem:ro
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      process1:
        condition: service_healthy
      process2:
        condition: service_healthy

  loki:
    image: grafana/loki:latest
    container_name: loki
    volumes:
      - ./monitor/loki-config.yml:/etc/loki/local-config.yml
    command: -config.file=/etc/loki/local-config.yml
    depends_on:
      process1:
        condition: service_healthy
      process2:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=72h'
      - '--web.enable-lifecycle'
      - '--log.level=warn'
    depends_on:
      process1:
          condition: service_healthy      
      process2:
          condition: service_healthy      

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./monitor/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_started
      process1:
        condition: service_healthy
      process2:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_LOG_LEVEL=warn
    depends_on:
      loki:
        condition: service_started
      process1:
        condition: service_healthy
      process2: 
        condition: service_healthy

volumes:
  postgres_data:
  logs_data:
  redis_data:
  prometheus_data: